plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'coolest.group'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}
//
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.rometools:rome:2.1.0'
	//removed key-value store dependency 
	//implementation 'org.springframework.data:spring-data-keyvalue'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    // JPA + Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // PostgreSQL driver (production / docker)
    runtimeOnly 'org.postgresql:postgresql:42.7.4'

    // H2 (optional – dev / tests)
    runtimeOnly 'com.h2database:h2'
    implementation "com.openai:openai-java:0.9.0"
	// appended Spring Data JPA for RDB integration
	//implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	
	// https://mvnrepository.com/artifact/org.springdoc/springdoc-openapi-starter-webmvc-ui
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	// appended integration with Docker and Docker Compose
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	
	// appended RDB drivers
	//runtimeOnly 'com.h2database:h2'
	//runtimeOnly 'org.postgresql:postgresql'
  
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
