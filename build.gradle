plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'coolest.group'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}
//
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'

	/// rometools used for RSS fetching
    implementation 'com.rometools:rome:2.1.0'
	
	///mongodb used for the database
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	// redis used for caching articles pulled from the web
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	//implementation("com.fasterxml.jackson.core:jackson-databind")    ---- might need to turn java to json when saving to redis
	
	
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	
	// appended integration with Docker and Docker Compose
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	
	// appended RDB drivers
	//runtimeOnly 'com.h2database:h2'
	//runtimeOnly 'org.postgresql:postgresql'
  
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
